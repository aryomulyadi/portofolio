<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2')
          format('woff2');
        font-weight: 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #171717;
        color: #f2efe8;
        font-family: 'Archivo', sans-serif;
        position: relative;
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #a5a5a0;
      }
      .dot {
        width: 16px;
        height: 16px;
        background: #d52b1e;
        border-radius: 50%;
      }
      h1 {
        font-weight: 900;
        font-stretch: 108%;
        font-size: 128px;
        line-height: 0.84;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      h1 .red {
        color: #d52b1e;
      }
      h1 .indent {
        padding-left: 96px;
      }
      .bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #a5a5a0;
      }
      .bottom b {
        color: #f2efe8;
        font-weight: 700;
      }
      .block {
        position: absolute;
        right: 0;
        top: 0;
        width: 28px;
        height: 100%;
        background: #d52b1e;
      }
    </style>
  </head>
  <body>
    <div class="block"></div>
    <div class="top"><span class="dot"></span> Creative Developer — Indonesia</div>
    <h1>
      RIFQI<br /><span class="indent">ARYO</span><br />MULYADI<span class="red">.</span>
    </h1>
    <div class="bottom">
      <span><b>Design</b> × Code</span>
      <span>Web · AI Platforms · Creative Tech / 2026</span>
    </div>
  </body>
</html>
